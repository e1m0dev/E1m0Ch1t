    permission: "e1ch.player"
    cooldown: 3 # Сколько еще нельзя будет писать в этот чат?
    prefix: "G | "
    radius: 0
    color: "&7"
    tag: "!"
  Local:
    permission: "e1ch.player"
    cooldown: 3
    prefix: "L | "
    radius: 7
    color: "&7"
    tag: ""
  Dev:
    permission: "e1ch.player"
    cooldown: 0
    prefix: "D | "
    radius: 0
    color: ""
    tag: "$"
  Admin:
    permission: "e1ch.adm"
    cooldown: 5
    prefix: "Admin | "
    radius: 0
    color: "&c"
    tag: "*"