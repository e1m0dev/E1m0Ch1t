Settings:
  chatFormat: "%color%chatPrefix%nick %donate -> %message"
  messageHover:
    - "%player_name%"
    - "%player_exp%"

Database:
  log: true # Будут ли логироватся сообщения?
  type: postgresql
  host: 217.171.146.202
  port: 5432
  name: server_prod
  user: elmo
  pass: ElmoDev

Permissions:
  bypassAdd: "e1ch.admin"
  bypassWord: "e1ch.admin"

AntiAdd:
  enable: true
  BlockList: # | Если, что-то из этого списка будет в сообщении игрока - сообщение не будет отправлено.
    - "https"
    - ".com"
    - ".ru"

AntiWords:
  enable: true
  BlockList:
    - "E1m0" # Например: Ник основателя сервера и администрации, чтобы не было упоминаний о нем для сокрытия высшей администрации.

Messages:
  Errors:
    cooldownDown: "У вас осталось еще %sec до конца задержки!"
    notAFindChat: "Не найдено не одного чата"
    blockWord: "Это слово - запрещено!"
    blockAdd: "Подозрения на рекламу!"

Effects:
  Mention:
    message: "Вас упомянули в чате! %sender!"
    sound: "ENTITY_PLAYER_LEVELUP"

